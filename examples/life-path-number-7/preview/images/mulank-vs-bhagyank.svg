<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#A45B3E" stroke-width="2"/></marker></defs><rect width="1200" height="760" fill="#F5EDE0"/>
<text x="600" y="80" text-anchor="middle" font-family="Noto Sans, Arial" font-size="34" font-weight="700" fill="#421206">Same birthday, two different numbers</text>
<rect x="380" y="120" width="440" height="100" fill="#E3DBC7" stroke="#421206" stroke-width="2"/><text x="600.0" y="182.0" text-anchor="middle" font-family="Noto Sans, Arial" font-size="38" font-weight="700" fill="#421206">12 / 03 / 1990</text>
<path d="M470 230 L300 330" stroke="#A45B3E" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M730 230 L900 330" stroke="#A45B3E" stroke-width="3" fill="none" marker-end="url(#a)"/>
<rect x="90" y="340" width="420" height="170" fill="#E3DBC7" stroke="#421206" stroke-width="2"/><text x="300.0" y="425.0" text-anchor="middle" font-family="Noto Sans, Arial" font-size="30" font-weight="700" fill="#421206">Mulank (birth number)</text><text x="300.0" y="465.0" text-anchor="middle" font-family="Noto Sans, Arial" font-size="22" fill="#421206">Day only: 1 + 2 = 3</text><rect x="690" y="340" width="420" height="170" fill="#421206" stroke="#421206" stroke-width="2"/><text x="900.0" y="425.0" text-anchor="middle" font-family="Noto Sans, Arial" font-size="30" font-weight="700" fill="#E0BF71">Bhagyank (life path)</text><text x="900.0" y="465.0" text-anchor="middle" font-family="Noto Sans, Arial" font-size="22" fill="#E0BF71">Whole date: 7</text>
<text x="300" y="580" text-anchor="middle" font-family="Noto Sans, Arial" font-size="24" fill="#421206">How you show up day to day</text><text x="900" y="580" text-anchor="middle" font-family="Noto Sans, Arial" font-size="24" fill="#421206">The direction of your life's work</text>
<text x="600" y="680" text-anchor="middle" font-family="Noto Sans, Arial" font-size="24" fill="#A45B3E">In Indian numerology 7 is linked with Ketu; Western numerology links it with Neptune.</text></svg>